<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Vocabulary Revision 90 – Queen English Center</title>
<style>
:root{--navy:#111c37;--gold:#f5cf6b;--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mute:#6b7385;--pri:#3b5bdb;--ok:#2f9e44;--no:#e03131;--line:#e3e7f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0}
#top{position:sticky;top:0;z-index:20}
.brand{background:var(--navy);color:var(--gold);text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 8px}
.bar{background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:52px}
.bar .t{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hide{display:none!important}
h1{font-size:24px;margin:8px 0 4px;text-align:center}
.cbadge{display:block;width:max-content;margin:6px auto 14px;background:var(--navy);color:var(--gold);border-radius:999px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1.5px}
.sub{text-align:center;color:var(--mute);margin:0 0 16px;font-size:14px}
.lbl{font-weight:800;font-size:14px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mode{background:var(--card);border-radius:16px;padding:16px;text-align:left;box-shadow:0 2px 8px rgba(17,28,55,.07);border:2px solid transparent;color:var(--ink)}
.mode:active{transform:scale(.98)}
.mode .ic{font-size:30px}
.mode b{display:block;font-size:17px;margin:6px 0 2px}
.mode span{color:var(--mute);font-size:13px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ghost{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;color:var(--ink)}
.ios{background:#fff4d6;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;text-align:center}
.foot{text-align:center;color:#a0a7b8;font-size:11px;padding:18px 0 26px;letter-spacing:.5px}
/* quiz */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:12px}
.qcard{background:var(--card);border-radius:20px;padding:22px 16px;text-align:center;box-shadow:0 2px 10px rgba(17,28,55,.08);margin-bottom:14px;position:relative}
.qk{font-size:13px;color:var(--mute);font-weight:700;margin-bottom:8px}
.emo{font-size:84px;line-height:1.1}
.qw{font-size:30px;font-weight:800;margin:4px 0;word-break:break-word}
.qvn{font-size:26px;font-weight:800;color:#c2410c;word-break:break-word}
.ipa{color:var(--mute);font-size:15px}
.spk{position:absolute;right:12px;top:12px;background:#eef2ff;border-radius:50%;width:46px;height:46px;font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-size:17px;font-weight:700;min-height:58px;color:var(--ink)}
.opt.ok{background:#d3f9d8;border-color:var(--ok)}
.opt.no{background:#ffe3e3;border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-radius:14px;padding:12px;text-align:center;font-weight:700}
.fb.ok{background:#d3f9d8;color:#1b5e20}.fb.no{background:#ffe3e3;color:#8a1c1c}
.next{display:block;width:100%;margin-top:12px;background:var(--pri);color:#fff;border-radius:14px;padding:14px;font-size:18px;font-weight:800}
.hint{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--mute);margin-top:10px}
/* flash */
.flip{perspective:1000px;height:320px;margin-bottom:14px}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(17,28,55,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.face.back{transform:rotateY(180deg);background:#fff8e6}
.row2{display:flex;gap:10px}.row2 button{flex:1}
/* type */
.tin{width:100%;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--line);text-align:center;font-weight:700;outline:none}
.tin:focus{border-color:var(--pri)}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:700;min-height:56px;font-size:15px;color:var(--ink)}
.mi.sel{border-color:var(--pri);background:#eef2ff}
.mi.done{visibility:hidden}
.mi.bad{background:#ffe3e3;border-color:var(--no)}
/* result */
.res{background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 2px 10px rgba(17,28,55,.08)}
.res .big{font-size:56px}
.res .sc{font-size:34px;font-weight:900;margin:6px 0}
.miss{text-align:left;margin:14px 0;max-height:240px;overflow:auto;border-top:1px solid var(--line)}
.miss div{padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rbrand{margin-top:14px;font-weight:900;color:var(--navy);letter-spacing:1.5px;font-size:13px}
/* gate */
#gate{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#gate .crown{font-size:60px}
#gate b{color:var(--gold);letter-spacing:2px;font-size:14px;margin:6px 0 24px}
#gate button{background:var(--gold);color:var(--navy);border-radius:999px;padding:18px 34px;font-size:22px;font-weight:900}
#gate p{opacity:.8;font-size:13px;max-width:320px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.06)}}
</style>
</head>

<div id="gate"><div class="crown">👑</div><b id="gBrand"></b><button id="gBtn">🔊 Chạm để bắt đầu</button><p id="gIos" class="hide">iPhone/iPad: gạt nút chuông bên hông sang <u>bật chuông</u> để nghe được tiếng.</p></div>

<div id="top"><div class="brand" id="brand"></div>
<div class="bar"><span class="t" id="ttl">Vocabulary Revision</span><button id="homeBtn" class="hide">🏠</button></div></div>

<div class="wrap">
 <section id="home">
  <h1>📚 Vocabulary Revision</h1>
  <span class="cbadge" id="badge"></span>
  <p class="sub">90 từ · nhớ nghĩa qua 3 chiều: <b>Ảnh → Việt</b> · <b>Việt → Anh</b> · <b>Anh → Việt</b></p>
  <div class="lbl">① Chọn nhóm từ</div>
  <div class="chips" id="groups"></div>
  <div class="lbl">② Chọn trò chơi</div>
  <div class="modes">
   <button class="mode" data-m="flash"><div class="ic">📖</div><b>Thẻ học</b><span>Lật thẻ xem nghĩa, nghe đọc — học trước khi chơi</span></button>
   <button class="mode" data-m="pic"><div class="ic">🖼️</div><b>Ảnh → Việt</b><span>Nhìn hình, chọn nghĩa tiếng Việt</span></button>
   <button class="mode" data-m="vi"><div class="ic">🇻🇳</div><b>Việt → Anh</b><span>Đọc nghĩa tiếng Việt, chọn từ tiếng Anh</span></button>
   <button class="mode" data-m="en"><div class="ic">🔤</div><b>Anh → Việt</b><span>Nghe & đọc từ tiếng Anh, chọn nghĩa</span></button>
   <button class="mode" data-m="match"><div class="ic">🧩</div><b>Nối cặp</b><span>Nối từ tiếng Anh với nghĩa tiếng Việt</span></button>
   <button class="mode" data-m="type"><div class="ic">⌨️</div><b>Viết từ</b><span>Nhìn nghĩa Việt, gõ đúng chính tả tiếng Anh</span></button>
  </div>
  <div class="tools"><button class="ghost" id="testA">🔊 Kiểm tra âm thanh</button></div>
  <div class="ios hide" id="iosNote">📱 iPhone/iPad: không nghe tiếng? Gạt nút chuông bên hông sang <b>bật chuông</b>.</div>
 </section>

 <section id="play" class="hide"></section>
 <div class="foot" id="foot"></div>
</div>

<script>
const CENTER="QUEEN ENGLISH CENTER", UNIT="Vocabulary Revision · 90 từ";
const D=JSON.parse(document.getElementById('data').textContent);
const W=D.words, CONF=D.conflict;
const $=s=>document.querySelector(s);
['brand','badge','gBrand'].forEach(id=>$('#'+id).textContent=(id==='brand'?'👑 ':'')+CENTER);
$('#foot').textContent='👑 '+CENTER+' · '+UNIT;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS){$('#gIos').classList.remove('hide');$('#iosNote').classList.remove('hide')}

/* ---------- AUDIO: 2 thẻ <audio> + Blob URL (chạy cả iPhone) ---------- */
const RAW=JSON.parse(document.getElementById('audio').textContent);const URLS={};
for(const k in RAW){const b=atob(RAW[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);URLS[k]=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}
const AV=new Audio(),AF=new Audio();[AV,AF].forEach(a=>{a.preload='auto';a.setAttribute('playsinline','')});
let ctx=null;
function unlock(){[AV,AF].forEach(a=>{a.src=URLS.fx_silent;const p=a.play();p&&p.catch(()=>{})});
 try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')ctx.resume();const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0)}catch(e){}}
['touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(ctx&&ctx.state!=='running')ctx.resume()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state!=='running')ctx.resume()});
function say(i){AV.pause();AF.pause();AV.src=URLS['w'+i];AV.currentTime=0;const p=AV.play();p&&p.catch(()=>{fallback(i)})}
function fallback(i){try{const u=new SpeechSynthesisUtterance(W[i].say);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function fx(k){AF.pause();AF.src=URLS['fx_'+k];AF.currentTime=0;const p=AF.play();p&&p.catch(()=>{})}
$('#gBtn').onclick=()=>{unlock();$('#gate').classList.add('hide')};
$('#testA').onclick=()=>say(0);

/* ---------- groups ---------- */
const GROUPS=[{n:'Tất cả 90 từ',a:0,b:W.length}];
for(let s=0;s<W.length;s+=15)GROUPS.push({n:`Từ ${s+1}–${Math.min(s+15,W.length)}`,a:s,b:Math.min(s+15,W.length)});
let G=1;
function drawGroups(){$('#groups').innerHTML=GROUPS.map((g,i)=>`<button class="chip${i===G?' on':''}" data-g="${i}">${g.n}</button>`).join('');
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{G=+c.dataset.g;drawGroups()})}
drawGroups();
const pool=()=>{const g=GROUPS[G];return [...Array(g.b-g.a)].map((_,k)=>g.a+k)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clash=(i,j)=>CONF.some(([x,y])=>(W[i].en===x&&W[j].en===y)||(W[i].en===y&&W[j].en===x));
function distract(i,n){const near=shuf(pool().filter(j=>j!==i&&!clash(i,j)));
 let out=near.slice(0,n);if(out.length<n)out=out.concat(shuf([...W.keys()].filter(j=>j!==i&&!out.includes(j)&&!clash(i,j))).slice(0,n-out.length));return out}

/* ---------- navigation ---------- */
const TITLES={flash:'📖 Thẻ học',pic:'🖼️ Ảnh → Việt',vi:'🇻🇳 Việt → Anh',en:'🔤 Anh → Việt',match:'🧩 Nối cặp',type:'⌨️ Viết từ'};
let MODE=null;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
$('#homeBtn').onclick=home;
function home(){AV.pause();$('#play').classList.add('hide');$('#home').classList.remove('hide');$('#homeBtn').classList.add('hide');$('#ttl').textContent='Vocabulary Revision';scrollTo(0,0)}
function start(m,list){MODE=m;$('#home').classList.add('hide');$('#play').classList.remove('hide');$('#homeBtn').classList.remove('hide');
 $('#ttl').textContent=TITLES[m]+' · '+GROUPS[G].n;scrollTo(0,0);
 const ids=list||pool();
 if(m==='flash')flash(ids);else if(m==='match')match(ids);else quiz(m,ids)}
const P=()=>$('#play');

/* ---------- 1. FLASHCARDS ---------- */
function flash(ids){let k=0,order=ids.slice();
 function draw(){const i=order[k],w=W[i];
  P().innerHTML=`<div class="meta"><span>Thẻ ${k+1}/${order.length}</span><span>Chạm thẻ để lật</span></div>
  <div class="flip" id="fl"><div class="fin">
   <div class="face"><div class="emo">${w.emo}</div><div class="qw">${w.en}</div><div class="ipa">${w.ipa} · (${w.pos})</div></div>
   <div class="face back"><div class="emo" style="font-size:56px">${w.emo}</div><div class="qvn">${w.vn}</div><div class="ipa" style="margin-top:6px">${w.en}</div></div>
  </div></div>
  <div class="row2"><button class="ghost" id="pv">◀ Trước</button><button class="ghost" id="sp">🔊 Nghe</button><button class="ghost" id="nx">Sau ▶</button></div>
  <div class="row2" style="margin-top:10px"><button class="ghost" id="sh">🔀 Trộn thẻ</button><button class="next" style="margin:0" id="go">Chơi Ảnh → Việt ▶</button></div>`;
  $('#fl').onclick=()=>{$('#fl').classList.toggle('on')};
  $('#sp').onclick=()=>say(i);
  $('#pv').onclick=()=>{k=(k-1+order.length)%order.length;draw()};
  $('#nx').onclick=()=>{k=(k+1)%order.length;draw()};
  $('#sh').onclick=()=>{order=shuf(order);k=0;draw()};
  $('#go').onclick=()=>start('pic',ids);
  say(i)}
 draw()}

/* ---------- 2-4. QUIZ (pic / vi / en) + 6. TYPE ---------- */
function quiz(m,ids){let q=shuf(ids),done=0,first=0,tries=0;const total=ids.length,wrong=new Set(),seen=new Set();
 function draw(){if(!q.length)return result(total,first,[...wrong],m,ids);
  const i=q[0],w=W[i];
  let head='',opts='';
  if(m==='pic'){head=`<div class="qk">Hình này là gì? Chọn nghĩa tiếng Việt</div><div class="emo">${w.emo}</div><button class="hint" id="hn">💡 Gợi ý: xem từ tiếng Anh</button><div id="hw" class="qw hide" style="font-size:22px">${w.en}</div>`}
  if(m==='vi'){head=`<div class="qk">Từ tiếng Anh nào có nghĩa là…</div><div class="qvn">${w.vn}</div>`}
  if(m==='en'){head=`<div class="qk">Nghĩa tiếng Việt của từ này là gì?</div><div class="qw">${w.en}</div><div class="ipa">${w.ipa}</div>`}
  if(m==='type'){head=`<div class="qk">Gõ từ tiếng Anh có nghĩa là…</div><div class="emo" style="font-size:60px">${w.emo}</div><div class="qvn">${w.vn}</div><div class="ipa" id="hw2" style="margin-top:6px;letter-spacing:3px;font-size:20px;font-weight:700">${mask(w.ans,0)}</div>`}
  if(m!=='type'){const ch=shuf([i,...distract(i,3)]);
   opts=`<div class="opts">${ch.map(j=>`<button class="opt" data-j="${j}">${m==='vi'?W[j].en:W[j].vn}</button>`).join('')}</div>`}
  else opts=`<input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ tiếng Anh…"><div class="row2" style="margin-top:10px"><button class="ghost" id="hint2">💡 Gợi ý 1 chữ</button><button class="next" style="margin:0" id="chk">Kiểm tra</button></div>`;
  P().innerHTML=`<div class="prog"><i style="width:${done/total*100}%"></i></div>
  <div class="meta"><span>Đã thuộc ${done}/${total}</span><span>⭐ ${first} đúng ngay lần đầu</span></div>
  <div class="qcard">${m!=='vi'?`<button class="spk" id="spk">🔊</button>`:''}${head}</div>${opts}<div id="fbx"></div>`;
  if($('#spk'))$('#spk').onclick=()=>say(i);
  if(m==='pic'||m==='en')say(i);
  if($('#hn'))$('#hn').onclick=()=>{$('#hw').classList.remove('hide');$('#hn').remove()};
  if(m!=='type')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,i));
  else{tries=0;let reveal=0;const inp=$('#tin');setTimeout(()=>inp.focus(),50);
   $('#hint2').onclick=()=>{reveal=Math.min(reveal+1,w.ans.length);$('#hw2').textContent=mask(w.ans,reveal);wrong.add(i);inp.focus()};
   const chk=()=>{const v=norm(inp.value);if(!v)return;
    if(w.acc.some(a=>norm(a)===v))settle(i,true);
    else{tries++;inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');fx('no');
     if(tries>=2)settle(i,false);else{$('#fbx').innerHTML=`<div class="fb no">Chưa đúng, thử lại nhé! (còn 1 lần)</div>`}}};
   $('#chk').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()}}
 }
 function pick(b,i){const j=+b.dataset.j;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===i)x.classList.add('ok')});
  if(j!==i)b.classList.add('no','shake');settle(i,j===i)}
 function settle(i,ok){const w=W[i];
  if(ok&&!wrong.has(i)&&!seen.has(i))first++;
  seen.add(i);
  if(ok){done++;q.shift();fx('ok')}else{wrong.add(i);q.push(q.shift());fx('no')}
  if($('#tin')){$('#tin').disabled=true;$('#chk').disabled=true;$('#hint2').disabled=true}
  $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'} pop">${ok?'🎉 Chính xác!':'❌ Đáp án đúng:'}<br><span style="font-size:20px">${w.emo} ${w.en}</span> <span style="font-weight:500">${w.ipa}</span><br>= ${w.vn}${ok?'':'<br><small>Từ này sẽ quay lại ở cuối lượt.</small>'}</div><button class="next" id="nq">Tiếp ▶</button>`;
  setTimeout(()=>say(i),ok?350:450);
  $('#nq').onclick=draw;$('#nq').scrollIntoView({behavior:'smooth',block:'nearest'})}
 draw()}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function mask(s,n){let c=0;return s.split('').map(ch=>/[a-z]/i.test(ch)?(c++<n?ch:'_'):(ch===' '?'  ':ch)).join('')}

/* ---------- 5. MATCH ---------- */
function match(ids){const all=shuf(ids);let r=0,first=0,miss=new Set();const R=Math.ceil(all.length/6);
 function round(){const set=all.slice(r*6,r*6+6);if(!set.length)return result(all.length,all.length-miss.size,[...miss],'match',ids);
  const L=shuf(set),Rr=shuf(set);let sel=null,left=set.length;
  P().innerHTML=`<div class="prog"><i style="width:${r/R*100}%"></i></div><div class="meta"><span>Lượt ${r+1}/${R}</span><span>Chạm 1 từ Anh rồi chạm nghĩa Việt</span></div>
  <div class="mgrid"><div class="mcol">${L.map(i=>`<button class="mi" data-s="L" data-i="${i}">${W[i].emo} ${W[i].en}</button>`).join('')}</div>
  <div class="mcol">${Rr.map(i=>`<button class="mi" data-s="R" data-i="${i}">${W[i].vn}</button>`).join('')}</div></div>`;
  document.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
   if(b.classList.contains('done'))return;
   if(b.dataset.s==='L')say(+b.dataset.i);
   if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
   const a=+sel.dataset.i,c=+b.dataset.i;
   if(a===c){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done')});fx('ok');left--;sel=null;
    if(!left)setTimeout(()=>{r++;round()},500)}
   else{const s=sel;[s,b].forEach(x=>x.classList.add('bad','shake'));miss.add(s.dataset.s==='L'?a:c);fx('no');
    setTimeout(()=>{[s,b].forEach(x=>x.classList.remove('bad','shake','sel'))},500);sel=null}
  })}
 round()}

/* ---------- RESULT ---------- */
function result(total,firstOk,wrongIds,m,ids){const pct=Math.round(firstOk/total*100);fx('win');
 const st=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
 const msg=pct>=90?'Xuất sắc! Em nhớ từ rất tốt!':pct>=70?'Giỏi lắm! Ôn thêm vài từ nữa là thuộc hết!':'Cố lên! Ôn lại các từ bên dưới rồi chơi lại nhé!';
 P().innerHTML=`<div class="res"><div class="big">🏆</div><div style="font-size:30px">${st}</div>
 <div class="sc">${firstOk}/${total}</div><div>${m==='match'?'cặp nối đúng ngay':'từ đúng ngay lần đầu'} (${pct}%)</div>
 <p style="font-weight:700">${msg}</p>
 ${wrongIds.length?`<div class="lbl" style="text-align:left">Từ cần ôn lại (${wrongIds.length})</div><div class="miss">${wrongIds.map(i=>`<div>${W[i].emo} <b>${W[i].en}</b> ${W[i].ipa} — ${W[i].vn}</div>`).join('')}</div>`:''}
 <div class="row2">${wrongIds.length?`<button class="next" id="rw">🔁 Ôn từ sai</button>`:''}<button class="next" id="ra" style="background:var(--ok)">▶ Chơi lại</button></div>
 <button class="ghost" style="width:100%;margin-top:10px" id="rh">🏠 Về trang chính</button>
 <div class="rbrand">👑 ${CENTER}</div><div style="color:var(--mute);font-size:12px">${TITLES[m]} · ${GROUPS[G].n}</div></div>`;
 if($('#rw'))$('#rw').onclick=()=>start(m,wrongIds);
 $('#ra').onclick=()=>start(m,ids);$('#rh').onclick=home}
</script>
</body>
